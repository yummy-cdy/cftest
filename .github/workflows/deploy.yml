name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secrets presence (lengths only, no values leaked)
        run: |
          echo "GCP_HOST length: ${#GCP_HOST}"
          echo "GCP_USER length: ${#GCP_USER}"
          echo "GCP_SSH_KEY length: ${#GCP_SSH_KEY}"
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
          GCP_USER: ${{ secrets.GCP_USER }}
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd cftest
            git pull
            docker compose up -d --build
