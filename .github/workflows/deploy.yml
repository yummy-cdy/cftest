name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd cftest
            git pull
            docker compose up -d --build
            # docker compose up은 compose 설정 자체가 안 바뀌면 바인드 마운트된 파일(Caddyfile
            # 등) 내용이 바뀌어도 컨테이너를 재시작하지 않는다. Caddy가 매 배포마다 최신
            # Caddyfile을 다시 읽도록 강제로 재시작한다.
            docker compose restart caddy
